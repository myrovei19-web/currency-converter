<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CurrencyFlow</title>

<style>
:root {
    --bg: #0b1020;
    --card: rgba(255,255,255,.09);
    --card2: rgba(255,255,255,.06);
    --text: #ffffff;
    --muted: #aab2c5;
    --accent: #7c5cff;
    --accent2: #b65cff;
    --border: rgba(255,255,255,.12);
    --input: rgba(255,255,255,.08);
    --shadow: 0 30px 80px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    color: var(--text);
    font-family: Inter, Arial, sans-serif;

    background:
        radial-gradient(circle at 10% 10%, var(--accent), transparent 30%),
        radial-gradient(circle at 90% 90%, var(--accent2), transparent 30%),
        var(--bg);

    transition: background .4s, color .4s;
    padding: 20px;
}

button,
select,
input {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 1050px;
    margin: auto;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.control {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 14px;
    padding: 11px 14px;
    cursor: pointer;
    backdrop-filter: blur(15px);
}

.control option {
    background: #151a2b;
    color: white;
}

/* HERO */

.hero {
    text-align: center;
    margin: 35px 0;
}

.hero h1 {
    font-size: clamp(38px, 7vw, 72px);
    line-height: 1;
    margin-bottom: 15px;
}

.hero p {
    color: var(--muted);
    font-size: 18px;
}

/* CARD */

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 30px;

    backdrop-filter: blur(25px);
    box-shadow: var(--shadow);
}

/* GRID */

.converter {
    display: grid;
    grid-template-columns: 1fr 70px 1fr;
    gap: 15px;
    align-items: end;
}

.field label {
    display: block;
    margin-bottom: 9px;
    color: var(--muted);
    font-size: 14px;
}

.input-wrap {
    position: relative;
}

.input-wrap input,
.currency-select {
    width: 100%;
    min-height: 58px;

    background: var(--input);
    color: var(--text);

    border: 1px solid var(--border);
    border-radius: 17px;
    outline: none;

    padding: 0 17px;
    font-size: 17px;

    transition: .2s;
}

.input-wrap input:focus,
.currency-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(124,92,255,.15);
}

/* SELECT */

.currency-select {
    appearance: none;
    cursor: pointer;
    padding-right: 45px;

    background-image:
        linear-gradient(45deg, transparent 50%, white 50%),
        linear-gradient(135deg, white 50%, transparent 50%);

    background-position:
        calc(100% - 20px) 25px,
        calc(100% - 14px) 25px;

    background-size: 6px 6px;
    background-repeat: no-repeat;
}

/* SWAP */

.swap {
    width: 58px;
    height: 58px;
    border-radius: 50%;

    border: 0;
    cursor: pointer;

    color: white;
    font-size: 25px;

    background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );

    box-shadow: 0 10px 30px rgba(0,0,0,.25);

    transition: .3s;
}

.swap:hover {
    transform: rotate(180deg) scale(1.08);
}

/* RESULT */

.result {
    margin-top: 25px;

    border-radius: 24px;
    padding: 25px;

    text-align: center;

    background: var(--card2);
    border: 1px solid var(--border);
}

.result-label {
    color: var(--muted);
    margin-bottom: 8px;
}

.result-number {
    font-size: clamp(35px, 6vw, 55px);
    font-weight: 900;
    word-break: break-word;
}

.rate {
    margin-top: 10px;
    color: var(--muted);
}

.updated {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
}

/* SEARCH */

.search {
    margin-top: 20px;
}

.search input {
    width: 100%;
    padding: 14px 17px;

    border: 1px solid var(--border);
    border-radius: 15px;

    background: var(--input);
    color: var(--text);
    outline: none;
}

/* STATUS */

.status {
    margin-top: 15px;
    min-height: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
}

/* FOOTER */

.footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 20px;
}

/* THEMES */

body.theme-ocean {
    --bg: #06131c;
    --accent: #00b4d8;
    --accent2: #0077b6;
}

body.theme-forest {
    --bg: #07150e;
    --accent: #20c997;
    --accent2: #198754;
}

body.theme-sunset {
    --bg: #1c0b08;
    --accent: #ff6b35;
    --accent2: #ff3d81;
}

body.theme-royal {
    --bg: #0c071b;
    --accent: #8b5cf6;
    --accent2: #ec4899;
}

body.theme-light {
    --bg: #eef2ff;
    --card: rgba(255,255,255,.72);
    --card2: rgba(255,255,255,.55);
    --text: #171923;
    --muted: #646b7b;
    --border: rgba(0,0,0,.1);
    --input: rgba(255,255,255,.8);
    --accent: #635bff;
    --accent2: #9b51e0;
    --shadow: 0 30px 80px rgba(30,40,80,.18);
}

/* MOBILE */

@media(max-width:700px) {

    .header {
        flex-direction: column;
        align-items: stretch;
    }

    .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .converter {
        grid-template-columns: 1fr;
    }

    .swap {
        margin: auto;
        transform: rotate(90deg);
    }

    .swap:hover {
        transform: rotate(270deg) scale(1.08);
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<div class="app">

<header class="header">

    <div class="logo">
        💱 CurrencyFlow
    </div>

    <div class="controls">

        <select
            class="control"
            id="language"
            onchange="changeLanguage()">
        </select>

        <select
            class="control"
            id="theme"
            onchange="changeTheme()">
        </select>

    </div>

</header>


<section class="hero">

    <h1 id="title">
        Курс валют
    </h1>

    <p id="subtitle">
        Швидкий та точний конвертер валют
    </p>

</section>


<main class="card">

    <div class="converter">

        <div class="field">

            <label id="amountLabel">
                Сума
            </label>

            <div class="input-wrap">

                    id="amount"
                    type="number"
                    value="100"
                    min="0"
                    step="any"
                    oninput="convert()">

            </div>

        </div>


        <button
            class="swap"
            onclick="swapCurrencies()"
            title="Swap">

            ⇄

        </button>


        <div class="field">

            <label id="toLabel">
                У валюту
            </label>

            <select
                id="to"
                class="currency-select"
                onchange="convert()">
            </select>

        </div>

    </div>


    <div class="field" style="margin-top:18px">

        <label id="fromLabel">
            З валюти
        </label>

        <select
            id="from"
            class="currency-select"
            onchange="convert()">
        </select>

    </div>


    <div class="search">

        <input
            id="search"
            type="text"
            oninput="filterCurrencies()"
            placeholder="Пошук валюти...">

    </div>


    <div class="result">

        <div
            class="result-label"
            id="resultLabel">

            Результат

        </div>

        <div
            class="result-number"
            id="result">

            —

        </div>

        <div
            class="rate"
            id="rate">

            —

        </div>

        <div
            class="updated"
            id="updated">

            —

        </div>

    </div>


    <div
        class="status"
        id="status">

        Завантаження курсів...

    </div>

</main>


<div
    class="footer"
    id="footer">

    Курси оновлюються автоматично

</div>

</div>

    AUD:["🇦🇺","Australian Dollar"],
    JPY:["🇯🇵","Japanese Yen"],
    CNY:["🇨🇳","Chinese Yuan"],

    CZK:["🇨🇿","Czech Koruna"],
    SEK:["🇸🇪","Swedish Krona"],
    NOK:["🇳🇴","Norwegian Krone"],
    DKK:["🇩🇰","Danish Krone"],
    HUF:["🇭🇺","Hungarian Forint"],
    RON:["🇷🇴","Romanian Leu"],
    BGN:["🇧🇬","Bulgarian Lev"],
    TRY:["🇹🇷","Turkish Lira"],
    ILS:["🇮🇱","Israeli Shekel"],
    AED:["🇦🇪","UAE Dirham"],

    SAR:["🇸🇦","Saudi Riyal"],
    INR:["🇮🇳","Indian Rupee"],
    KRW:["🇰🇷","South Korean Won"],
    SGD:["🇸🇬","Singapore Dollar"],
    HKD:["🇭🇰","Hong Kong Dollar"],
    NZD:["🇳🇿","New Zealand Dollar"],
    MXN:["🇲🇽","Mexican Peso"],
    BRL:["🇧🇷","Brazilian Real"],
    ZAR:["🇿🇦","South African Rand"],
    THB:["🇹🇭","Thai Baht"],

    IDR:["🇮🇩","Indonesian Rupiah"],
    MYR:["🇲🇾","Malaysian Ringgit"],
    PHP:["🇵🇭","Philippine Peso"],
    VND:["🇻🇳","Vietnamese Dong"],
    ISK:["🇮🇸","Icelandic Krona"],
    GEL:["🇬🇪","Georgian Lari"],
    RSD:["🇷🇸","Serbian Dinar"],
    KZT:["🇰🇿","Kazakhstani Tenge"],
    EGP:["🇪🇬","Egyptian Pound"],
    CLP:["🇨🇱","Chilean Peso"]
};


/* =====================================================
   СТАН
===================================================== */

let rates = {};
let currentLanguage =
    localStorage.getItem("language") || "uk";

let currentTheme =
    localStorage.getItem("theme") || "dark";


const languageSelect =
    document.getElementById("language");

const themeSelect =
    document.getElementById("theme");

const fromSelect =
    document.getElementById("from");

const toSelect =
    document.getElementById("to");

const amount =
    document.getElementById("amount");


/* =====================================================
   МОВИ
===================================================== */

function setupLanguages() {

    languageSelect.innerHTML = "";

    for (const code in languages) {

        const lang = languages[code];

        languageSelect.add(
            new Option(
                `${lang.flag} ${lang.name}`,
                code
            )
        );
    }

    languageSelect.value = currentLanguage;
}


/* =====================================================
   ТЕМИ
===================================================== */

function setupThemes() {

    themeSelect.innerHTML = "";

    for (const key in themes) {

        themeSelect.add(
            new Option(
                themes[key],
                key
            )
        );
    }

    themeSelect.value = currentTheme;

    applyTheme();
}


function applyTheme() {

    document.body.className = "";

    if (currentTheme !== "dark") {
        document.body.classList.add(
            `theme-${currentTheme}`
        );
    }
}


function changeTheme() {

    currentTheme =
        themeSelect.value;

    localStorage.setItem(
        "theme",
        currentTheme
    );

    applyTheme();
}


/* =====================================================
   ПЕРЕКЛАД ІНТЕРФЕЙСУ
===================================================== */

function changeLanguage() {

    currentLanguage =
        languageSelect.value;

    localStorage.setItem(
        "language",
        currentLanguage
    );

    const t =
        languages[currentLanguage];

    document.documentElement.lang =
        currentLanguage;

    document.getElementById("title")
        .textContent = `💱 ${t.title}`;

    document.getElementById("subtitle")
        .textContent = t.subtitle;

    document.getElementById("amountLabel")
        .textContent = t.amount;

    document.getElementById("fromLabel")
        .textContent = t.from;

    document.getElementById("toLabel")
        .textContent = t.to;

    document.getElementById("resultLabel")
        .textContent = t.result;

    document.getElementById("search")
        .placeholder = t.search;

    document.getElementById("footer")
        .textContent = t.footer;

    renderCurrencies();

    convert();
}


/* =====================================================
   ВАЛЮТИ
===================================================== */

function renderCurrencies() {

    const oldFrom =
        fromSelect.value || "UAH";

    const oldTo =
        toSelect.value || "EUR";

    fromSelect.innerHTML = "";
    toSelect.innerHTML = "";

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();


    for (const code in currencyData) {

        const [flag, englishName] =
            currencyData[code];

        /*
          Назви показуємо мовою інтерфейсу.
          Якщо перекладу немає — залишаємо
          англійську назву.
        */

        const names = {
            uk: {
                USD:"Долар США",
                EUR:"Євро",
                UAH:"Українська гривня",
                GBP:"Фунт стерлінгів",
                PLN:"Польський злотий",
                JPY:"Японська єна",
                CNY:"Китайський юань",
                CHF:"Швейцарський франк"
            },
            en: {},
            pl: {},
            de: {},
            fr: {}
        };

        const translated =
            names[currentLanguage]?.[code]
            || englishName;

        const searchable =
            `${code} ${translated} ${englishName}`
                .toLowerCase();

        if (
            search &&
            !searchable.includes(search)
        ) {
            continue;
        }

        const text =
            `${flag} ${code} — ${translated}`;

        fromSelect.add(
            new Option(text, code)
        );

        toSelect.add(
            new Option(text, code)
        );
    }

    /*
      Після пошуку можемо тимчасово
      не мати потрібної валюти.
    */

    if (
        [...fromSelect.options]
            .some(o => o.value === oldFrom)
    ) {
        fromSelect.value = oldFrom;
    }

    if (
        [...toSelect.options]
            .some(o => o.value === oldTo)
    ) {
        toSelect.value = oldTo;
    }

    if (!fromSelect.value) {
        fromSelect.selectedIndex = 0;
    }

    if (!toSelect.value) {
        toSelect.selectedIndex = 0;
    }
}


/* =====================================================
   ПОШУК
===================================================== */

function filterCurrencies() {

    renderCurrencies();
}


/* =====================================================
   ОТРИМАННЯ РЕАЛЬНИХ КУРСІВ
===================================================== */

async function loadRates() {

    const status =
        document.getElementById("status");

    const t =
        languages[currentLanguage];

    status.textContent =
        t.loading;

    try {

        /*
          Frankfurter дозволяє отримати
          курси відносно EUR без API key.
        */

        const response =
            await fetch(
                "https://api.frankfurter.dev/v2/rates?base=EUR"
            );

        if (!response.ok) {
            throw new Error("API error");
        }

        const data =
            await response.json();

        rates = {
            EUR: 1
        };

        data.forEach(item => {

            if (
                currencyData[item.quote]
            ) {
                rates[item.quote] =
                    Number(item.rate);
            }

        });

        status.textContent = "";

        convert();

    } catch (error) {

        console.error(error);

        status.textContent =
            t.error;
    }
}


/* =====================================================
   КОНВЕРТАЦІЯ
===================================================== */

function convert() {

    const value =
        Number(amount.value);

    const from =
        fromSelect.value;

    const to =
        toSelect.value;

    if (
        !from ||
        !to ||
        !rates[from] ||
        !rates[to] ||
        !Number.isFinite(value)
    ) {
        document.getElementById("result")
            .textContent = "—";

        return;
    }

    /*
      Обидва курси відносно EUR.

      Наприклад:

      USD → EUR
      USD rate = 1.13
      EUR rate = 1

      Спочатку USD → EUR,
      потім EUR → потрібна валюта.
    */

    const inEUR =
        value / rates[from];

    const result =
        inEUR * rates[to];

    const one =
        rates[to] / rates[from];


    const formatter =
        new Intl.NumberFormat(
            currentLanguage,
            {
                maximumFractionDigits: 6
            }
        );


    document.getElementById("result")
        .textContent =
        `${formatter.format(result)} ${to}`;


    document.getElementById("rate")
        .textContent =
        `${languages[currentLanguage].rate}: 1 ${from} = ${formatter.format(one)} ${to}`;


    /*
      Frankfurter повертає дату в кожному
      записі. Для простоти беремо дату
      першого курсу.
    */

    const firstRate =
        Object.keys(rates).length;

    document.getElementById("updated")
        .textContent =
        firstRate > 0
        ? languages[currentLanguage].updated
        : "";
}


/* =====================================================
   SWAP
===================================================== */

function swapCurrencies() {

    const oldFrom =
        fromSelect.value;

    fromSelect.value =
        toSelect.value;

    toSelect.value =
        oldFrom;

    convert();
}


/* =====================================================
   ЗАПУСК
===================================================== */

setupLanguages();

setupThemes();

renderCurrencies();

fromSelect.value = "UAH";
toSelect.value = "EUR";

changeLanguage();

loadRates();

</script>
